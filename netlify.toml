# --- Redirections : une seule URL canonique (sans www) ---
[[redirects]]
  from = "https://www.geysse-elagage.fr/*"
  to = "https://geysse-elagage.fr/:splat"
  status = 301
  force = true

# --- Page 404 ---
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# --- Sécurité (toutes les pages) ---
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-src https://www.google.com; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# --- HTML : revalidation à chaque visite, contenu toujours à jour ---
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- content.json : jamais mis en cache (édité via le CMS) ---
[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# --- Images et assets : cache long, indispensable aux Core Web Vitals ---
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
