# --- Domaine canonique ---
# Domaine principal defini dans Netlify : geysse-elagage.fr (apex, sans www).
# Netlify redirige deja automatiquement www.geysse-elagage.fr vers l'apex.
# Ne pas ajouter ici de redirection dans le sens inverse (apex -> www) :
# elle entrerait en conflit avec le domaine principal.

# --- Page 404 ---
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# --- Securite (toutes les pages) ---
# frame-ancestors autorise l'affichage du site dans l'apercu de Mon CMS,
# tout en le bloquant pour tout autre site (protection anti-clickjacking).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-src https://www.google.com; base-uri 'self'; frame-ancestors 'self' https://mon-cms-mnrd.vercel.app; form-action 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# --- HTML : revalidation a chaque visite, contenu toujours a jour ---
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- content.json : jamais mis en cache (edite via le CMS) ---
[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# --- Images et assets : cache long, indispensable aux Core Web Vitals ---
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"